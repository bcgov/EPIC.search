name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test-search-api:
    name: Test search-api
    runs-on: [self-hosted, linux]
    defaults:
      run:
        working-directory: search-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: search-api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements/dev.txt

      - name: Lint
        run: flake8 src/

      - name: Unit tests
        run: pytest
        env:
          FLASK_ENV: testing

  test-vector-api:
    name: Test search-vector-api
    runs-on: [self-hosted, linux]
    defaults:
      run:
        working-directory: search-vector-api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: search-vector-api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: pytest tests/unit -v --tb=short
        env:
          FLASK_ENV: testing

  build-web:
    name: Build search-web
    runs-on: [self-hosted, linux]
    defaults:
      run:
        working-directory: search-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: search-web/package-lock.json

      - run: npm ci --prefer-offline

      - name: Build (test target)
        run: npm run build:test
